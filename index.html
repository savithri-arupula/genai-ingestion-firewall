
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>AI Assistant</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Markdown rendering and HTML sanitization -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon">✦</div>
                <div>
                    <h2>AI Assistant</h2>
                    <p>Get help with your queries</p>
                </div>
            </div>

            <button id="new-chat" class="new-chat" type="button">
                ＋ New Chat
            </button>

            <div class="sidebar-section">
                <h3>Suggested Prompts</h3>

                <button class="suggestion" type="button">
                    My payment was deducted twice. What should I do?
                </button>
                <button class="suggestion" type="button">
                    How can I reset my password?
                </button>
                <button class="suggestion" type="button">
                    I want to check my order status.
                </button>
                <button class="suggestion" type="button">
                    What are your refund policies?
                </button>
                <button class="suggestion" type="button">
                    How do I contact customer support?
                </button>
            </div>

            <div class="backend-status">
                <span id="status-dot" class="status-dot"></span>
                <div>
                    <strong id="backend-status">Checking backend...</strong>
                    <p>Java Spring Boot + Groq</p>
                </div>
            </div>
        </aside>

        <main class="chat-panel">
            <header class="chat-header">
                <h2 id="chat-title">New Chat</h2>
            </header>

            <section
                id="chat-messages"
                class="chat-messages"
                aria-live="polite"
                aria-label="Chat messages"
            >
                <div id="welcome" class="welcome">
                    <div class="welcome-icon">✦</div>
                    <h1>How can I help you?</h1>
                    <p>Ask a question to get started.</p>
                </div>
            </section>

            <div
                id="error-message"
                class="error-message"
                role="alert"
                hidden
            ></div>

            <form id="chat-form" class="chat-form">
                <textarea
                    id="message-input"
                    placeholder="Type your message..."
                    rows="1"
                    maxlength="5000"
                    aria-label="Your message"
                    required
                ></textarea>

                <button
                    id="send-button"
                    type="submit"
                    aria-label="Send message"
                    title="Send message"
                >
                    ➤
                </button>
            </form>

            <p class="disclaimer">
                AI-generated responses may not always be accurate.
                Press Enter to send, or Shift + Enter for a new line.
            </p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
